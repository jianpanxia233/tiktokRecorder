name: 构建 Windows 版

# 打 tag（v*）时自动出包并创建 Release；也可以在 Actions 页面手动点运行
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bundle_ffmpeg:
        description: "内置 ffmpeg（约 +80MB，强烈建议开启，否则客户端启动即退出）"
        type: boolean
        default: true
      bundle_node:
        description: "内置 Node.js（约 +80MB，斗鱼等依赖 JS 签名的平台需要）"
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest
    env:
      # Windows runner 的控制台是 cp1252，任何中文输出都会抛 UnicodeEncodeError。
      # 脚本里已经各自 reconfigure 过，这里再兜一层。
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt pyinstaller

      - name: 从 GitHub Secret 注入卡密密钥
        shell: pwsh
        env:
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
        run: |
          if (-not $env:LICENSE_SECRET) {
            Write-Host "==== 没有读到 Secret：LICENSE_SECRET ====" -ForegroundColor Red
            Write-Host "请逐条检查："
            Write-Host "  1. 标签页对不对：Settings -> Secrets and variables -> Actions"
            Write-Host "     要加在 'Repository secrets' 里，不要加到 'Environment secrets'"
            Write-Host "  2. 别加在 'Variables' 标签页 —— 那里是 vars 不是 secrets，工作流读不到"
            Write-Host "  3. 名字必须一模一样：LICENSE_SECRET"
            Write-Host "  4. 值 = 本地 tools/license_secret.txt 里那串十六进制，不要带引号或换行"
            Write-Host "  5. 确认是在 jianpanxia233/tiktokRecorder 这个仓库里加的"
            throw "缺少 LICENSE_SECRET"
          }
          Write-Host ("已读到 LICENSE_SECRET，长度 " + $env:LICENSE_SECRET.Length + "（应为 64）")
          python tools/gen_secret.py --from-hex $env:LICENSE_SECRET --force

      - name: PyInstaller 打包
        run: pyinstaller pack/DouyinLiveRecorder.spec --noconfirm

      - name: 后处理（配置模板 / ffmpeg / node）
        shell: pwsh
        run: |
          $flags = @()
          if ("${{ inputs.bundle_ffmpeg }}" -ne "false") { $flags += "--ffmpeg" }
          if ("${{ inputs.bundle_node }}"   -ne "false") { $flags += "--node" }
          python pack/post_build.py --app-dir dist/DouyinLiveRecorder @flags

      - name: 校验产物完整性
        shell: pwsh
        run: |
          $app = "dist/DouyinLiveRecorder"

          # PyInstaller 6 的 onedir 把 datas 放进 _internal/，而 config/ffmpeg/node
          # 是 post_build 摆在 exe 同级的。所以每个文件给出候选路径，命中任一即可。
          function Assert-AnyOf($desc, [string[]]$paths) {
            foreach ($p in $paths) {
              if (Test-Path (Join-Path $app $p)) {
                Write-Host ("  OK   {0,-12} {1}" -f $desc, $p)
                return
              }
            }
            throw ("产物缺少 {0}（找过：{1}）" -f $desc, ($paths -join " / "))
          }

          Assert-AnyOf "主程序"     @("DouyinLiveRecorder.exe")
          Assert-AnyOf "配置模板"   @("config/config.ini")
          Assert-AnyOf "房间列表"   @("config/URL_config.ini")
          Assert-AnyOf "图形界面"   @("app/web/index.html", "_internal/app/web/index.html")
          Assert-AnyOf "JS 运行时"  @("_internal/src/javascript/liveme.js", "src/javascript/liveme.js")
          Assert-AnyOf "开源协议"   @("LICENSE")
          Assert-AnyOf "使用说明"   @("使用说明.txt")

          # ffmpeg / node 是 Windows 上最容易出问题、也最致命的两块（缺 ffmpeg 客户端启动即退出）
          if ("${{ inputs.bundle_ffmpeg }}" -ne "false") { Assert-AnyOf "内置ffmpeg" @("ffmpeg/ffmpeg.exe") }
          if ("${{ inputs.bundle_node }}"   -ne "false") { Assert-AnyOf "内置node"   @("node/node.exe") }

          Write-Host ""
          Write-Host "产物根目录："
          Get-ChildItem $app | Select-Object Mode, Length, Name | Format-Table
          Write-Host "总大小：$([math]::Round((Get-ChildItem $app -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"

      - name: 压缩
        run: Compress-Archive -Path dist/DouyinLiveRecorder/* -DestinationPath dist/DouyinLiveRecorder-windows.zip -Force

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinLiveRecorder-windows
          path: dist/DouyinLiveRecorder-windows.zip
          retention-days: 30

      - name: 打 tag 时创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DouyinLiveRecorder-windows.zip
